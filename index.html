<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRUVITO — Симулятор перекупника та ящиків</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1E6BFF;
      --primary-hover: #1557D6;
      --accent: #E92EFB;
      --success: #16C75A;
      --loot: #FFB020;
      --danger: #EF4444;
      --dark-bg: #0B1226;
      --dark-card: #121C38;
      --light-bg: #F6F8FC;
      --white: #FFFFFF;
      --text-dark: #111827;
      --text-muted: #5B6478;
      --border-light: #E2E8F0;
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-dark);
      background-color: var(--light-bg);
      line-height: 1.5;
      overflow-x: hidden;
      font-variant-numeric: tabular-nums;
    }

    h1, h2, h3, .brand-font {
      font-family: 'Unbounded', sans-serif;
      line-height: 1.2;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ================= HEADER ================= */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 18, 38, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 0;
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--white);
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.5px;
    }

    .logo-icon-wrap {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, #1E6BFF, #E92EFB);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(30, 107, 255, 0.45);
      flex-shrink: 0;
    }

    .logo-icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.78);
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--white);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 700;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      font-family: 'Inter', sans-serif;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, #3B82F6 100%);
      color: var(--white);
      padding: 12px 22px;
      font-size: 14px;
      box-shadow: 0 8px 24px rgba(30, 107, 255, 0.4);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary-hover) 0%, #2563EB 100%);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(30, 107, 255, 0.55);
    }

    .btn-lg {
      padding: 16px 30px;
      font-size: 16px;
      border-radius: 16px;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      color: var(--white);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 16px 26px;
      font-size: 16px;
      border-radius: 16px;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-2px);
    }

    /* ================= HERO SECTION ================= */
    .hero {
      position: relative;
      background-color: var(--dark-bg);
      color: var(--white);
      padding: 56px 0 76px;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -10%;
      width: 900px;
      height: 900px;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(30, 107, 255, 0.11) 0deg 12deg,
        transparent 12deg 24deg
      );
      mask-image: radial-gradient(circle, rgba(0,0,0,1) 15%, transparent 68%);
      -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 15%, transparent 68%);
      pointer-events: none;
      animation: spinRays 60s linear infinite;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -120px;
      left: -120px;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(233, 46, 251, 0.22) 0%, transparent 70%);
      pointer-events: none;
    }

    @keyframes spinRays {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .hero-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.05fr 1.15fr;
      gap: 44px;
      align-items: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(30, 107, 255, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93C5FD;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .hero-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .hero h1 {
      font-size: clamp(30px, 4vw, 48px);
      margin-bottom: 18px;
      letter-spacing: -0.5px;
    }

    .hero h1 span {
      background: linear-gradient(90deg, #60A5FA, #E92EFB);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: rgba(255, 255, 255, 0.78);
      font-size: 17px;
      margin-bottom: 30px;
      max-width: 520px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 28px;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      color: rgba(255, 255, 255, 0.68);
    }

    .hero-meta strong {
      display: block;
      color: var(--white);
      font-size: 18px;
      font-weight: 800;
    }

    /* ================= TRAILER PLAYER ================= */
    .trailer-card {
      background: var(--dark-card);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(30, 107, 255, 0.22);
    }

    .trailer-screen {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      background: radial-gradient(circle at center, #1E3A8A 0%, #090E1E 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }

    .trailer-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 3;
    }

    .sim-pill {
      background: rgba(11, 18, 38, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .sim-balance {
      background: var(--success);
      color: #052E16;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(22, 199, 90, 0.4);
    }

    .trailer-stage {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: auto 0;
    }

    .stage-item-card {
      background: var(--white);
      color: var(--text-dark);
      border-radius: 16px;
      padding: 14px;
      width: 235px;
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.45);
      transition: transform 0.35s ease;
    }

    .stage-item-img {
      height: 92px;
      border-radius: 10px;
      background: linear-gradient(135deg, #E2E8F0, #CBD5E1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 10px;
      position: relative;
    }

    .stage-badges {
      position: absolute;
      bottom: 6px;
      left: 6px;
      display: flex;
      gap: 4px;
    }

    .mini-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      color: #fff;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 18, 38, 0.42);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 4;
      cursor: pointer;
      transition: background 0.2s, opacity 0.25s;
    }

    .play-overlay:hover {
      background: rgba(11, 18, 38, 0.25);
    }

    .play-btn-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
